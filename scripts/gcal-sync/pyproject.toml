[project]
name = "aoife-gcal-sync"
version = "1.0.0"
description = "One-way nightly sync of Aoife's planner into the 'Aoife's School' Google Calendar"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
]

[project.scripts]
gcal-sync = "gcal_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcal_sync"]
